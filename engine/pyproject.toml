[project]
name = "daypart-engine"
version = "0.1.0"
description = "Daypart Engine — adherence intelligence engine (hackathon build on pinned LHM)."
requires-python = ">=3.12"
dependencies = [
    # D8: pinned LHM SDK with the scoring extra. Pre-existing Syntropy code (R12).
    "syntropy-lhm[lhm-scoring] @ git+https://github.com/Syntropy-Health/lhm@4821dc74406de21a0e5274892be433f00d6f0ad0",
    "numpy>=2,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    # D16: aviary is the primary virtual-environment framework.
    "fhaviary>=0.37,<0.38",
]

[project.scripts]
daypart-demo = "daypart.demo.cli:main"

[dependency-groups]
demo = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "streamlit>=1.40,<2",
    "uvicorn>=0.30,<1",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
# demo (FastAPI + Streamlit) installs by default so `uv run daypart-demo` works offline after `uv sync`.
default-groups = ["dev", "demo"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["daypart*"]

[tool.setuptools.package-data]
"daypart.membrane" = ["rules/*.yaml"]
"daypart.eval" = ["runs.yaml"]
"daypart.demo" = ["static/*.html", "fixtures/*"]
"daypart.memory" = ["*.json", "*.csv"]
"daypart.governance" = ["*.yaml"]

[tool.pyright]
# CI type check (HAC-38 G20): basic mode over the daypart package.
include = ["daypart"]
# Runs only inside the Modal image; torch/transformers/peft/trl/modal are not engine dependencies.
exclude = ["daypart/train/modal_app.py"]
typeCheckingMode = "basic"
pythonVersion = "3.12"

[tool.pytest.ini_options]
addopts = ""
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

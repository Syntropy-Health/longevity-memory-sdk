# Default eval runs config (CONTRACT slice E, E1.1). Every arm is reported (G2).
version: eval-v1
cohort_seed: 0
arms:
  - name: r2_boundary_dsl
    kind: r2_dsl
    corpus: tests/sealed/data/r2_corpus_v1.jsonl
  - name: env_always_none
    kind: env_baseline
    policy: always_none
    n_scenarios: 50
    seeds: [0, 1, 2]
    horizon: 14
  - name: env_always_barrier_problem_solving
    kind: env_baseline
    policy: always_barrier_problem_solving
    n_scenarios: 50
    seeds: [0, 1, 2]
    horizon: 14
  - name: env_random_intent
    kind: env_baseline
    policy: random_intent
    n_scenarios: 50
    seeds: [0, 1, 2]
    horizon: 14
  - name: i1_gate
    kind: i1_gate
  - name: base
    kind: boundary_eval
    model: base
    results: ../docs/daypart/results
  - name: sft
    kind: boundary_eval
    model: sft
    results: ../docs/daypart/results
  - name: dpo
    kind: boundary_eval
    model: dpo
    results: ../docs/daypart/results
  # HAC-75 (plan 4.1-4.3): synthetic only, CPU, no paid API. grpo is scored on the env_baseline scenarios.
  - name: grpo
    kind: grpo_policy
    n_scenarios: 50
    seeds: [0, 1, 2]
    horizon: 14
  - name: rm
    kind: reward_model
  - name: jev
    kind: jev_library
  # Track B (AIR-319): calibrated escalation, fit on synthetic, scored on the curated-25.
  # horizon = days of history each held-out member is assessed on.
  - name: escalation
    kind: escalation
    seeds: [0, 1, 2]
    horizon: 42
